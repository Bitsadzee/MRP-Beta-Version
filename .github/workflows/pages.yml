name: Deploy MRP web game to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Extract game source
        run: unzip -q MRP-Beta-Source-0.1.0-beta.0.zip -d source
      - name: Install dependencies
        run: npm ci
        working-directory: source
      - name: Build web game
        run: npm run build
        working-directory: source
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web build
        uses: actions/upload-pages-artifact@v3
        with:
          path: source/dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publish web game
        id: deployment
        uses: actions/deploy-pages@v4
